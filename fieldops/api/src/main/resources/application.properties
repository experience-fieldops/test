spring.application.name=api

# ── Datasource H2 ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:fieldopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 Console ────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Storage local ─────────────────────────────────────────────────────────────
storage.local.path=uploads
storage.max-size-bytes=10485760

# ── Multipart upload ──────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── JWT ───────────────────────────────────────────────────────────────────────
# Segredo em Base64 (>= 256 bits para HS256). Troque por um valor forte via variavel de ambiente em producao.
jwt.secret=${JWT_SECRET:U2VjcmV0S2V5Rm9yRmllbGRPcHNBUElXaXRoQXRMZWFzdDI1NkJpdHNMb25nRW5vdWdo}
# Tempo de expiracao do token em milissegundos (24h)
jwt.expiration=86400000

# ── Swagger / OpenAPI (SpringDoc) ─────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
