name: CI - Backend Java #define o nome do runner 

on: # define quando as ações vão disparar 
  push: # sempre que houver push
    branches:
      - main
      - develop
      - backend-devops        
    paths:  # só dispara se mudou algo nesses caminhos
      - 'fieldops/api/**' 
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'fieldops/api/**'
      - '.github/workflows/ci-backend.yml'

defaults: # define diretorio padrao para correr os passos 
  run:
    working-directory: fieldops/api

jobs: # nome do job e a maquina virtual que roda
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest   

    steps: # ações pela qual o CI vai passar 

      # baixa o codigo na maquina virtual
      - name: Checkout código
        uses: actions/checkout@v4

      # instala o java 17 
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # garante a permissao do mvn dentro da maquina linux
      - name: Permissão no mvnw
        run: chmod +x mvnw

      # só compila o projeto 
      - name: Compilar projeto
        run: ./mvnw compile -B

      # roda testes unitários 
      - name: Rodar testes
        run: ./mvnw test -B
        env:
          JWT_SECRET: ci-test-secret-key-at-least-256-bits-long-for-hs256

      # salva relatorio dos testes como artefato
      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: fieldops/api/target/surefire-reports/
          retention-days: 7

      # gera um jar final (bundle final da api)
      - name: Gerar JAR
        run: ./mvnw package -B -DskipTests

      # salva o jar como artefato também 
      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: fieldops/api/target/*.jar
          retention-days: 7
